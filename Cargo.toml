[workspace]
resolver = "2"
members = [
    "thaw",
    "thaw_components",
    "thaw_macro",
    "thaw_utils",
    "demo",
    "demo_markdown",
]
exclude = ["examples"]

[workspace.package]
rust-version = "1.79"

[workspace.dependencies]
thaw = { version = "0.5.0-beta", path = "./thaw" }
thaw_components = { version = "0.4.0-beta", path = "./thaw_components" }
thaw_macro = { version = "0.1.0", path = "./thaw_macro" }
thaw_utils = { version = "0.2.0-beta", path = "./thaw_utils" }

# leptos
leptos = { version = "0.9.0-alpha" }
leptos_meta = { version = "0.9.0-alpha" }
leptos_router = { version = "0.9.0-alpha" }
reactive_stores = { version = "0.5.0-alpha" }

# web
wasm-bindgen = { version = "0.2.121" }

[patch.crates-io]
leptos = { git = "https://github.com/tysen/leptos", branch = "leptos_0.9" }
leptos_meta = { git = "https://github.com/tysen/leptos", branch = "leptos_0.9" }
leptos_router = { git = "https://github.com/tysen/leptos", branch = "leptos_0.9" }
reactive_stores = { git = "https://github.com/tysen/leptos", branch = "leptos_0.9" }
reactive_graph = { git = "https://github.com/tysen/leptos", branch = "leptos_0.9" }
leptos_transition_group = { git = "https://github.com/tysen/leptos-transition-group", branch = "leptos_0.9" }
