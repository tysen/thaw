[workspace]
resolver = "2"
members = [
    "thaw",
    "thaw_components",
    "thaw_macro",
    "thaw_utils",
    "demo",
    "demo_markdown",
    "examples/island",
    "examples/ssr_axum",
]
# Examples are SSR/hydrate apps with mutually-exclusive leptos features; keep them
# out of routine `cargo build`/`check` so feature unification doesn't enable
# conflicting csr/ssr/hydrate on thaw. Build them explicitly (`-p island` / cargo-leptos).
default-members = [
    "thaw",
    "thaw_components",
    "thaw_macro",
    "thaw_utils",
    "demo",
    "demo_markdown",
]

[workspace.package]
rust-version = "1.79"

[workspace.dependencies]
thaw = { version = "0.5.0-beta", path = "./thaw" }
thaw_components = { version = "0.4.0-beta", path = "./thaw_components" }
thaw_macro = { version = "0.1.0", path = "./thaw_macro" }
thaw_utils = { version = "0.2.0-beta", path = "./thaw_utils" }

# leptos — plain version reqs; the consuming workspace picks the source.
leptos = { version = "0.9.0-beta" }
leptos_meta = { version = "0.9.0-beta" }
leptos_router = { version = "0.9.0-beta" }
reactive_stores = { version = "0.5.0-beta" }

# web
wasm-bindgen = { version = "0.2.121" }

# Compile dependencies optimized while keeping own code fast to build.
# https://benw.is/posts/how-i-improved-my-rust-compile-times-by-seventy-five-percent#optimization-level
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Size-optimized profile for WASM release bundles (referenced by the examples via cargo-leptos).
[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"
